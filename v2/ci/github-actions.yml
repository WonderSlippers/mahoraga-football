# Prepared template, not installed at repository root and never pushed.
# Activate only through the repository's separately reviewed CI change.
name: mahoraga-v2-core
on: workflow_dispatch
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - run: npm ci
      - run: node scripts/setup-python.mjs
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: npm run report:verification -- --core
# Core deliberately excludes private historical model artifacts, live sources,
# and the separate 60-minute local load run. Their NOT_RUN status is explicit.
# No deployment, upload of private files, or old-service operation is defined.
